<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Utools.bd CMS — অ্যাডমিন প্যানেল</title>
  <!--
    Fixes "Failed to load config.yml (404)": when this page is reached at
    /admin (no trailing slash) instead of /admin/, the browser's relative-URL
    base is the site root, so Decap CMS's relative fetch("config.yml") was
    resolving to https://utools.bd/config.yml instead of .../admin/config.yml.
    An explicit <base> pins every relative URL on this page to /admin/
    regardless of which form of the URL the visitor lands on.
  -->
  <base href="/admin/" />
  <link rel="cms-config-url" href="/admin/config.yml" type="text/yaml" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans Bengali', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <!-- This gate's own logout (clears only the utools_admin_gate cookie via
       middleware.ts; does not touch Decap CMS's GitHub login). -->
  <a
    href="/admin/logout"
    style="position:fixed;bottom:10px;right:10px;z-index:9999;font:12px -apple-system,sans-serif;color:#6b7280;background:#fff;border:1px solid #e5e7eb;padding:4px 10px;border-radius:999px;text-decoration:none;"
  >Basic Auth Logout</a>
  <!-- Decap CMS (Formerly Netlify CMS) CDN script -->
  <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
  <script>
    // Blog Preview Template mirroring BlogPostPage layout
    const BlogPreview = createClass({
      render: function() {
        const entry = this.props.entry;
        const title = entry.getIn(['data', 'title']) || 'পোস্টের শিরোনাম';
        const excerpt = entry.getIn(['data', 'excerpt']) || '';
        const date = entry.getIn(['data', 'date']) || '';
        const author = entry.getIn(['data', 'author']) || 'ইউটিলিটি টিম';
        const category = entry.getIn(['data', 'category']) || '';
        const image = entry.getIn(['data', 'image']);
        const relatedToolLabel = entry.getIn(['data', 'relatedToolLabel']);
        const body = this.props.widgetFor('content');

        return h('div', { style: { padding: '24px', maxWidth: '800px', margin: '0 auto', fontFamily: "'Noto Sans Bengali', -apple-system, sans-serif", color: '#0F1F17', lineHeight: '1.7' } },
          h('div', { style: { display: 'flex', gap: '8px', alignItems: 'center', marginBottom: '14px', flexWrap: 'wrap' } },
            category && h('span', { style: { padding: '3px 10px', background: '#FEF3D0', color: '#B45309', borderRadius: '999px', fontSize: '11px', fontWeight: 'bold' } }, category),
            date && h('span', { style: { padding: '3px 10px', background: '#E6F4EC', color: '#0B5D3B', borderRadius: '999px', fontSize: '11px', fontWeight: 'bold' } }, String(date)),
            author && h('span', { style: { color: '#4A5A52', fontSize: '12px', marginLeft: 'auto' } }, author)
          ),
          h('h1', { style: { fontSize: '26px', fontWeight: '800', lineHeight: '1.3', color: '#0F1F17', margin: '16px 0' } }, title),
          excerpt && h('p', { style: { fontStyle: 'italic', background: '#F8FAF9', padding: '16px', borderRadius: '12px', color: '#4A5A52', border: '1px solid #D5E4DB', margin: '16px 0' } }, '"' + excerpt + '"'),
          relatedToolLabel && h('div', { style: { padding: '12px 16px', background: '#E6F4EC', border: '1px solid #0B5D3B40', borderRadius: '12px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', margin: '16px 0' } },
            h('span', { style: { fontWeight: 'bold', color: '#0B5D3B', fontSize: '13px' } }, 'সম্পর্কিত টুল: ' + relatedToolLabel),
            h('span', { style: { background: '#0B5D3B', color: '#fff', padding: '6px 12px', borderRadius: '8px', fontSize: '12px', fontWeight: 'bold' } }, 'টুল দেখুন →')
          ),
          image && h('img', { src: this.props.getAsset(image), style: { width: '100%', maxHeight: '420px', objectFit: 'cover', borderRadius: '14px', margin: '16px 0', border: '1px solid #D5E4DB' } }),
          h('div', { style: { fontSize: '15px', color: '#34443B', marginTop: '20px' } }, body)
        );
      }
    });
    if (window.CMS) {
      CMS.registerPreviewTemplate('blog', BlogPreview);
    }
  </script>
</body>
</html>
