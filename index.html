    <script>
      /* Ensure window.fetch has both a getter and a setter so parent iframe environments or extensions can safely attach/wrap fetch */
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;
          var descriptor = {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          };
          Object.defineProperty(window, 'fetch', descriptor);
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (_) {}
          }
        } catch (_) {}
      })();
    </script>
